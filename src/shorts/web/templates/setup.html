{% extends "base.html" %}{% block title %}Einrichtung{% endblock %}{% block header %}{% endblock %}
{% block content %}
<section class="card" style="max-width:440px;margin:96px auto 0">
  <h1 style="margin-bottom:4px">Passwort festlegen</h1>
  <p class="sub" style="margin-bottom:24px">Einmalig beim ersten Start. Gespeichert wird nur ein Hash</p>
  <form method="post" action="/setup" class="fields">
    <label>Passwort, mindestens {{ min_len }} Zeichen <input type="password" name="password" minlength="{{ min_len }}" required autofocus autocomplete="new-password"></label>
    <label>Passwort wiederholen <input type="password" name="password2" minlength="{{ min_len }}" required autocomplete="new-password"></label>
    <div><button style="width:100%;justify-content:center">Passwort festlegen</button></div>
  </form>
</section>
{% endblock %}
