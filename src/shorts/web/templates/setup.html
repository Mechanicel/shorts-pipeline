{% extends "base.html" %}{% block title %}Einrichtung{% endblock %}{% block header %}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto">
  <h1>Willkommen 👋</h1>
  <p class="muted">Lege beim ersten Start ein Passwort fest. Es wird nur als Hash gespeichert.</p>
  <form method="post" action="/setup" class="row" style="flex-direction:column;align-items:stretch">
    <input type="password" name="password" placeholder="Passwort (mind. {{ min_len }} Zeichen)" minlength="{{ min_len }}" required autofocus>
    <input type="password" name="password2" placeholder="Passwort wiederholen" minlength="{{ min_len }}" required>
    <button class="primary">Passwort festlegen</button>
  </form>
</div>
{% endblock %}
