# Kanal-Konfiguration. Pro Kanal/Sprache ein Eintrag; die Pipeline läuft mit --channel <key>.
# Geheimnisse gehören NICHT hierher, sondern in .env.

channels:
  de:
    name: "Was ändert sich für dich?"
    language: de
    locale_hint: "Deutschland"           # Zielgruppe/Land für den Prompt
    youtube_token: credentials/token_de.json
    youtube_category_id: "25"            # 25 = News & Politics
    contains_synthetic_media: false      # YouTube-Kennzeichnung "veränderte/synthetische Inhalte"
    tts_voice: null                      # null = OPENAI_TTS_VOICE aus .env
    tts_instructions_v3: >-
      Sprich freundlich und ruhig auf Deutsch, wie ein Tipp unter Freunden. Klar und deutlich, nicht hektisch.
    tts_instructions: >-
      Sprich wie eine freundliche, sachliche Nachrichtensprecherin auf Deutsch.
      Zügiges Tempo, klare Betonung von Zahlen und Daten.
    espeak_voice: de                     # nur Dry-Run / Offline-TTS
    default_hashtags: ["#shorts", "#wasändertsichfürdich", "#verbraucher"]
    outro_text: "Folge für mehr Änderungen, die dich betreffen."
    max_new_topics_per_run: 12           # so viele neue Themen gehen pro Lauf an Claude
    max_videos_per_run: 7                # so viele Videos werden pro Woche gerendert
    # Veröffentlichungs-Slots (Europe/Berlin). Upload-Job verteilt freigegebene Videos darauf.
    publish_slots:
      - "Mon 17:00"
      - "Tue 17:00"
      - "Wed 17:00"
      - "Thu 17:00"
      - "Fri 17:00"
      - "Sat 11:00"
      - "Sun 11:00"
    # Pixabay-Suchbegriffe für bewegte Hintergründe (nur aktiv, wenn PIXABAY_API_KEY gesetzt ist).
    # Querformat wird automatisch auf 9:16 zugeschnitten. Eigene Clips in assets/backgrounds/
    # haben Vorrang; ohne beides: generierte Ball-Animation.
    # Getestet 2026-11-20: liefern viel Bewegung und passen zu den Tags (Filter: jedes Wort muss in den Tags stehen).
    # Schlecht waren: kinetic sand/satisfying (Strände, Tempel), slime (Schnecken), dominoes/paint mixing (0 Treffer).
    background_queries:
      - fireworks
      - traffic timelapse
      - hyperlapse
      - ink
      - particles
      - abstract
      - roller coaster
      - drone city
    # Vorfilter (kostenlos): Titel mit diesen Begriffen sind fast nie Verbraucherthemen → vor Claude verworfen.
    title_blocklist:
      - gratuliert
      - kondoliert
      - Glückwunsch
      - empfängt
      - Treffen mit
      - trifft
      - telefoniert
      - Telefonat
      - Reise nach
      - reist nach
      - besucht
      - Antrittsbesuch
      - Staatsbesuch
      - Tagung
      - Konferenz
      - Rede von
      - würdigt
      - Gedenken
    sources:
      - name: Bundesregierung – Artikel
        type: rss
        url: https://www.bundesregierung.de/service/rss/breg-de/1151246/feed.xml
      # Monatsübersichten „Was ist neu im …?“ – ein Artikel kann eine v3-Merkliste mit mehreren Punkten ergeben
      - name: Bundesregierung – Neuregelungen
        type: html
        url: https://www.bundesregierung.de/breg-de/aktuelles/gesetzliche-neuregelungen-442800
        link_pattern: '^/breg-de/aktuelles/(gesetzliche-)?neuregelungen-[a-z0-9-]*\d{6,}$'
        max_items: 6
      # Deaktiviert am 25.11.2026: in den ersten Läufen kein einziges Video (0 von 26 / 20 / 11 Themen)
      - name: Bundesregierung – Pressemitteilungen
        type: rss
        url: https://www.bundesregierung.de/service/rss/breg-de/1151244/feed.xml
        enabled: false
      - name: Bundesfinanzministerium – Pressemitteilungen
        type: rss
        url: https://www.bundesfinanzministerium.de/SiteGlobals/Functions/RSSFeed/DE/Pressemitteilungen/RSSPressemitteilungen.xml
        enabled: false
      - name: BMAS – Aktuelles
        type: rss
        url: https://www.bmas.de/SiteGlobals/Functions/RSSFeed/DE/RSSNewsfeed/RSSNewsfeed.xml
      - name: Bundesnetzagentur – Pressemitteilungen
        type: rss
        url: https://www.bundesnetzagentur.de/SiteGlobals/Functions/RSSFeed/DE/RSSNewsfeed/RSSNewsfeed_Pressemitteilungen.xml?nn=693926
        enabled: false
      - name: Verbraucherzentrale – Wissen
        type: html                       # kein RSS vorhanden -> Links von der Startseite
        url: https://www.verbraucherzentrale.de/
        link_pattern: '^/wissen/[a-z0-9/_-]+-\d+$'
        max_items: 15
